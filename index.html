<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabStock</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            margin: 0;
            padding: 20px;
        }

        header {
            background: #173b65;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin: 15px 0;
        }

        .component {
            background: white;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px #ddd;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .out {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>LabStock</h1>
        <p>Electronics Laboratory Component Tracker</p>
    </header>

    <div class="container">

        <h2>Search Components</h2>

        <input
            type="text"
            id="search"
            placeholder="Search for a component..."
            onkeyup="searchComponent()"
        >

        <div id="componentList">

            <div class="component">
                <h3>Resistor</h3>
                <p>Quantity: 50</p>
                <p>Location: Rack A1</p>
                <p class="available">Available</p>
            </div>

            <div class="component">
                <h3>Capacitor</h3>
                <p>Quantity: 30</p>
                <p>Location: Rack A2</p>
                <p class="available">Available</p>
            </div>

            <div class="component">
                <h3>Diode</h3>
                <p>Quantity: 0</p>
                <p>Location: Rack B1</p>
                <p class="out">Out of Stock</p>
            </div>

            <div class="component">
                <h3>Transistor</h3>
                <p>Quantity: 20</p>
                <p>Location: Rack B2</p>
                <p class="available">Available</p>
            </div>

        </div>
    </div>

    <script>
        function searchComponent() {
            let input = document.getElementById("search").value.toLowerCase();

            let components = document.getElementsByClassName("component");

            for (let i = 0; i < components.length; i++) {
                let name = components[i].getElementsByTagName("h3")[0].innerText.toLowerCase();

                if (name.includes(input)) {
                    components[i].style.display = "block";
                } else {
                    components[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
